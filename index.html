<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRICKET RASH</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#07111f;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    height:65px;
    background:#0d1b2a;
    display:flex;
    align-items:center;
    padding:0 18px;
}

header img{
    width:42px;
    height:42px;
    border-radius:10px;
    object-fit:cover;
    margin-right:12px;
}

header span{
    font-size:21px;
    font-weight:bold;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:18px;
}

.player{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:14px;
    overflow:hidden;
}

.player iframe{
    width:100%;
    height:100%;
    border:0;
}

.title{
    margin:25px 0 12px;
    font-size:20px;
    font-weight:bold;
}

.channel{
    width:150px;
    background:#102238;
    border:1px solid #29435e;
    border-radius:14px;
    padding:14px;
    cursor:pointer;
}

.channel img{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:12px;
    display:block;
    margin:auto;
}

.channel-name{
    text-align:center;
    margin-top:10px;
    font-size:14px;
    font-weight:bold;
}

.popup-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.popup{
    width:100%;
    max-width:400px;
    background:#102238;
    border-radius:16px;
    padding:22px;
    position:relative;
}

.close{
    position:absolute;
    right:15px;
    top:8px;
    font-size:28px;
    color:#aaa;
    cursor:pointer;
}

.popup-logo{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:14px;
    display:block;
    margin:5px auto 12px;
}

.popup-name{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-bottom:18px;
}

.popup-link{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #38516c;
    background:#07111f;
    color:#fff;
    margin-bottom:10px;
}

.open-button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:9px;
    background:#1683ff;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
    <img id="<a href="https://ibb.co/kVBhM1HF"><img src="https://i.ibb.co/TD2HrLv5/IMG-20261026-200738-475.jpg" alt="IMG 20261026 200738 475" border="0"></a>">
    <span id="CRICKET RASH"></span>
</header>

<div class="container">

    <div class="player">
        <iframe
            id="streamPlayer"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>
    </div>

    <div class="title">Channels</div>

    <div class="channel" onclick="openPopup()">
        <img id="channelLogo">
        <div class="channel-name" id="channelName"></div>
    </div>

</div>

<div class="popup-bg" id="popup">

    <div class="popup">

        <div class="close" onclick="closePopup()">×</div>

        <img class="popup-logo" id="popupLogo">

        <div class="popup-name" id="popupName"></div>

        <input
            class="popup-link"
            id="popupLink"
            readonly>

        <button
            class="open-button"
            onclick="openChannel()">
            Open Channel
        </button>

    </div>

</div>

<script>

const CHANNEL_NAME = "CRICKET RASH";
const CHANNEL_LOGO = "<a href="https://ibb.co/kVBhM1HF"><img src="https://i.ibb.co/TD2HrLv5/IMG-20261026-200738-475.jpg" alt="IMG 20261026 200738 475" border="0"></a>";
const CHANNEL_LINK = "https://t.me/cricket_raash";
const PLAYER_LINK = "https://crickcast-star1.pages.dev/?id=E2HD";

document.title = CRICKET RASH;

document.getElementById("headerName").textContent =
    CHANNEL_NAME;

document.getElementById("channelName").textContent =
    CHANNEL_NAME;

document.getElementById("popupName").textContent =
    CHANNEL_NAME;

document.getElementById("headerLogo").src =
    CHANNEL_LOGO;

document.getElementById("channelLogo").src =
    CHANNEL_LOGO;

document.getElementById("popupLogo").src =
    CHANNEL_LOGO;

document.getElementById("popupLink").value =
    CHANNEL_LINK;

document.getElementById("streamPlayer").src =
 https://crickcast-star1.pages.dev/?id=E2HD;

function openPopup(){
    document.getElementById("popup").style.display="flex";
}

function closePopup(){
    document.getElementById("popup").style.display="none";
}

function openChannel(){
    window.open(CHANNEL_LINK,"_blank");
}

</script>

</body>
</html>
