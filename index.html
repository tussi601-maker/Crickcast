<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRICKET RASH</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
background:#090d12;
color:#fff;
font-family:Arial,sans-serif;
}

.topbar{
height:55px;
display:flex;
align-items:center;
padding:0 15px;
background:#10161d;
border-bottom:1px solid #202a34;
}

.topbar-title{
font-size:16px;
font-weight:bold;
}

.page{
width:100%;
max-width:900px;
margin:auto;
padding:28px 18px;
}

.channel{
width:100%;
min-height:140px;
background:#111820;
border:1px solid #202b35;
border-radius:10px;
display:flex;
align-items:center;
padding:18px;
gap:16px;
}

.logo-box{
width:120px;
height:110px;
flex-shrink:0;
background:#fff;
border-radius:9px;
overflow:hidden;
}

.logo-box img{
width:100%;
height:100%;
object-fit:contain;
}

.channel-info{
flex:1;
min-width:0;
}

.channel-name{
font-size:19px;
font-weight:bold;
margin-bottom:10px;
}

.live{
display:inline-block;
background:#e53935;
padding:5px 9px;
border-radius:4px;
font-size:11px;
font-weight:bold;
}

.watch-btn{
border:0;
background:#1688d8;
color:#fff;
padding:13px 19px;
border-radius:6px;
font-size:13px;
font-weight:bold;
cursor:pointer;
}

.player-container{
display:none;
width:100%;
margin-top:20px;
background:#000;
border-radius:10px;
overflow:hidden;
border:1px solid #202b35;
}

.player{
width:100%;
aspect-ratio:16/9;
}

.player iframe{
width:100%;
height:100%;
border:0;
display:block;
}

.popup-bg{
display:none;
position:fixed;
inset:0;
z-index:99999;
background:rgba(0,0,0,.78);
align-items:center;
justify-content:center;
padding:20px;
}

.popup{
width:100%;
max-width:360px;
background:#151c24;
border:1px solid #29343d;
border-radius:13px;
padding:24px;
text-align:center;
position:relative;
}

.close{
position:absolute;
right:15px;
top:8px;
color:#aaa;
font-size:28px;
cursor:pointer;
}

.popup-logo{
width:100px;
height:100px;
background:#fff;
border-radius:10px;
object-fit:contain;
display:block;
margin:5px auto 15px;
}

.popup-name{
font-size:21px;
font-weight:bold;
margin-bottom:18px;
}

.popup-btn{
display:block;
width:100%;
padding:12px;
margin-top:10px;
border:0;
border-radius:7px;
background:#1688d8;
color:#fff;
text-decoration:none;
font-size:13px;
font-weight:bold;
cursor:pointer;
}

.footer{
text-align:center;
color:#59636d;
font-size:11px;
margin-top:30px;
}

@media(max-width:500px){
.channel{
min-height:140px;
padding:16px;
gap:12px;
}

.logo-box{
width:105px;
height:100px;
}

.channel-name{
font-size:16px;
}

.watch-btn{
padding:11px 13px;
font-size:11px;
}
}
</style>
</head>

</div>

</div>

<div class="channel-info">
<div class="channel-name">CRICKET RASH</div>
<span class="live">LIVE</span>
</div>

</div>

</div>


<div class="footer">

</div>

</div>

<a

<button

</button>

</div>

</div>
