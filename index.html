<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRICKET RASH</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: white;
}

/* =========================
   ONLY CHANGE THESE 4 VALUES
   ========================= */

:root {
    --channel-name: "CRICKET RASH";
    --channel-logo: "<a href="https://ibb.co/kVBhM1HF"><img src="https://i.ibb.co/TD2HrLv5/IMG-20261026-200738-475.jpg" alt="IMG 20261026 200738 475" border="0"></a>";
    --channel-link: "https://t.me/cricket_raash";
}

/* ========================= */

.header {
    height: 65px;
    background: #111820;
    display: flex;
    align-items: center;
    padding: 0 18px;
    border-bottom: 1px solid #27313b;
}

.header-title {
    font-size: 22px;
    font-weight: bold;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 25px 15px;
}

/* Channel card */

.channel-card {
    background: #151c24;
    border: 1px solid #29343f;
    border-radius: 12px;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 15px;
    cursor: pointer;
    transition: 0.2s;
}

.channel-card:hover {
    background: #1b242e;
    transform: translateY(-1px);
}

.channel-logo {
    width: 65px;
    height: 65px;
    border-radius: 10px;
    object-fit: contain;
    background: #fff;
    padding: 5px;
}

.channel-info {
    flex: 1;
}

.channel-name {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 7px;
}

.live {
    display: inline-block;
    background: #e53935;
    padding: 4px 8px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: bold;
}

.watch {
    background: #1976d2;
    border: none;
    color: white;
    padding: 10px 16px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

/* Player */

.player-box {
    margin-top: 25px;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #29343f;
}

.player {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
}

.player iframe,
.player video {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}

/* Popup */

.popup-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.popup {
    width: 100%;
    max-width: 400px;
    background: #151c24;
    border: 1px solid #303b47;
    border-radius: 15px;
    padding: 22px;
    position: relative;
    text-align: center;
}

.popup-close {
    position: absolute;
    right: 15px;
    top: 10px;
    font-size: 25px;
    cursor: pointer;
    color: #aaa;
}

.popup-logo {
    width: 90px;
    height: 90px;
    object-fit: contain;
    background: white;
    border-radius: 12px;
    padding: 7px;
    margin: 15px auto;
}

.popup-name {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 18px;
}

.popup-button {
    display: block;
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    background: #1976d2;
    color: white;
    text-decoration: none;
    font-weight: bold;
    margin-top: 10px;
}

.footer {
    text-align: center;
    color: #7d8791;
    font-size: 13px;
    padding: 25px 10px;
}

/* Mobile */

@media(max-width:600px) {

    .header-title {
        font-size: 19px;
    }

    .channel-card {
        padding: 12px;
    }

    .channel-logo {
        width: 55px;
        height: 55px;
    }

    .channel-name {
        font-size: 16px;
    }

    .watch {
        padding: 8px 11px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-title">CRICKET RASH</div>
</header>

<main class="container">

    <!-- ONE CHANNEL ONLY -->

    <div class="channel-card" onclick="openPopup()">

        <img
            id="channelLogo"
            class="channel-logo"
            src="<a href="https://ibb.co/kVBhM1HF"><img src="https://i.ibb.co/TD2HrLv5/IMG-20261026-200738-475.jpg" alt="IMG 20261026 200738 475" border="0"></a>"
            alt="Channel Logo"
        >

        <div class="channel-info">
            <div id="channelName" class="CRICKET RASH">
                YOUR CHANNEL NAME
            </div>

            <span class="live">LIVE</span>
        </div>

        <button class="watch" onclick="event.stopPropagation(); openPlayer();">
            WATCH
        </button>

    </div>


    <!-- PLAYER -->

    <div id="playerBox" class="player-box" style="display:none;">

        <div class="player">

            <!--
            YAHAN APNA AUTHORIZED PLAYER EMBED KARO.

            Example iframe:

            <iframe
                src="YOUR PLAYER URL"
                allowfullscreen>
            </iframe>

            Agar tumhare paas .m3u8 stream URL hai,
            to neeche JavaScript wala HLS player use hoga.
            -->

            <div id="playerContent"></div>

        </div>

    </div>

</main>


<footer class="footer">
    Live Cricket
</footer>


<!-- CHANNEL POPUP -->

<div id="popupBg" class="popup-bg" onclick="closePopup(event)">

    <div class="popup" onclick="event.stopPropagation()">

        <div class="popup-close" onclick="closePopup()">×</div>

        <img
            id="popupLogo"
            class="popup-logo"
            src=""
            alt="Logo"
        >

        <div id="popupName" class="popup-name">
        </div>

        <a
            id="https://t.me/cricket_raash"
            class="popup-button"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            Open Channel
        </a>

        <button
            class="popup-button"
            onclick="openPlayer(); closePopup();"
        >
            Watch Live
        </button>

    </div>

</div>


<script>

/* ==========================================
   CHANNEL SETTINGS
   SIRF YE VALUES CHANGE KARO
   ========================================== */

const CHANNEL_NAME = "YOUR CHANNEL NAME";

const CHANNEL_LOGO = "YOUR LOGO LINK";

const CHANNEL_LINK = "YOUR CHANNEL LINK";


/*
   PLAYER SETTING

   OPTION 1:
   Agar iframe player URL hai:
*/

const PLAYER_URL = "https://crickcast-star1.pages.dev/?id=E2HD";


/*
   OPTION 2:
   Agar .m3u8 link hai to PLAYER_URL me
   apna .m3u8 URL daal do.

   Example:
   https://example.com/live/stream.m3u8

   Agar iframe URL hai to:
   https://example.com/player.html
*/


/* ========================================== */

document.getElementById("channelName").textContent = CHANNEL_NAME;
document.getElementById("channelLogo").src = CHANNEL_LOGO;

document.getElementById("popupName").textContent = CHANNEL_NAME;
document.getElementById("popupLogo").src = CHANNEL_LOGO;
document.getElementById("channelLink").href = CHANNEL_LINK;


/* Open popup */

function openPopup() {
    document.getElementById("popupBg").style.display = "flex";
}


/* Close popup */

function closePopup(event) {

    if (
        !event ||
        event.target === document.getElementById("popupBg")
    ) {
        document.getElementById("popupBg").style.display = "none";
    }
}


/* Open player */

function openPlayer() {

    const box = document.getElementById("playerBox");
    const content = document.getElementById("playerContent");

    box.style.display = "block";

    /*
       iframe player
    */

    if (
        PLAYER_URL.startsWith("http://") ||
        PLAYER_URL.startsWith("https://")
    ) {

        content.innerHTML = `
            <iframe
                src="https://crickcast-star1.pages.dev/?id=E2HD"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen>
            </iframe>
        `;

    }

    box.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

</script>

</body>
</html>
