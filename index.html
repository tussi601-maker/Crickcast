<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cricket Live</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #090d12;
    color: #fff;
    font-family: Arial, sans-serif;
}

/* ==============================
   CHANNEL SETTINGS
   SIRF YE 4 CHEEZE CHANGE KARO
   ============================== */

const_dummy {
    display: none;
}

/* ============================== */

.topbar {
    height: 55px;
    display: flex;
    align-items: center;
    padding: 0 13px;
    background: #10161d;
    border-bottom: 1px solid #202a34;
}

.topbar-title {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .2px;
}

.page {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 10px;
}

/* Channel */

.channel {
    width: 100%;
    min-height: 100px;
    background: #111820;
    border: 1px solid #202b35;
    border-radius: 7px;
    display: flex;
    align-items: center;
    padding: 12px;
    gap: 12px;
}

/* Logo */

.logo-box {
    width: 82px;
    height: 76px;
    flex: 0 0 82px;
    border-radius: 6px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.logo-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* Info */

.channel-info {
    min-width: 0;
    flex: 1;
}

.channel-name {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 7px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.live {
    display: inline-block;
    background: #e53935;
    color: #fff;
    font-size: 9px;
    font-weight: bold;
    padding: 3px 6px;
    border-radius: 3px;
}

/* Watch button */

.watch-btn {
    border: 0;
    background: #1688d8;
    color: white;
    font-size: 11px;
    font-weight: bold;
    padding: 9px 12px;
    border-radius: 5px;
    cursor: pointer;
    flex-shrink: 0;
}

.watch-btn:active {
    transform: scale(.97);
}

/* Player */

.player-container {
    display: none;
    width: 100%;
    margin-top: 18px;
    background: #000;
    border-radius: 7px;
    overflow: hidden;
    border: 1px solid #202b35;
}

.player {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
}

.player iframe {
    width: 100%;
    height: 100%;
    display: block;
    border: 0;
}

/* Popup background */

.popup-bg {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0,0,0,.75);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

/* Popup */

.popup {
    width: 100%;
    max-width: 350px;
    background: #151c24;
    border: 1px solid #29343d;
    border-radius: 12px;
    padding: 22px;
    text-align: center;
    position: relative;
}

.close {
    position: absolute;
    right: 14px;
    top: 9px;
    color: #aaa;
    font-size: 25px;
    cursor: pointer;
}

.popup-logo {
    width: 90px;
    height: 90px;
    background: #fff;
    border-radius: 10px;
    object-fit: contain;
    display: block;
    margin: 10px auto 15px;
}

.popup-name {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 18px;
}

.popup-btn {
    display: block;
    width: 100%;
    padding: 11px;
    margin-top: 9px;
    border: 0;
    border-radius: 6px;
    background: #1688d8;
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.footer {
    text-align: center;
    color: #59636d;
    font-size: 11px;
    margin-top: 32px;
}

@media (max-width: 450px) {

    .channel {
        min-height: 92px;
        padding: 9px;
        gap: 9px;
    }

    .logo-box {
        width: 70px;
        height: 68px;
        flex-basis: 70px;
    }

    .channel-name {
        font-size: 14px;
    }

    .watch-btn {
        padding: 8px 9px;
        font-size: 10px;
    }
}
</style>
</head>

<body>

<div class="topbar">
    <div class="topbar-title" id="pageTitle"></div>
</div>

<div class="page">

    <!-- CHANNEL -->
    <div class="channel" onclick="showPopup()">

        <div class="logo-box">
            <img id="channelLogo" src="" alt="">
        </div>

        <div class="channel-info">
            <div class="channel-name" id="channelName"></div>
            <span class="live">LIVE</span>
        </div>

        <button class="watch-btn"
                onclick="event.stopPropagation(); showPlayer();">
            WATCH
        </button>

    </div>

    <!-- PLAYER -->
    <div class="player-container" id="playerContainer">

        <div class="player">
            <iframe
                id="playerFrame"
                src=""
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>

    </div>

    <div class="footer">
        Live Cricket
    </div>

</div>


<!-- POPUP -->

<div class="popup-bg" id="popupBg">

    <div class="popup">

        <div class="close" onclick="closePopup()">×</div>

        <img
            id="popupLogo"
            class="popup-logo"
            src=""
            alt=""
        >

        <div
            id="popupName"
            class="popup-name">
        </div>

        <a
            id="channelLink"
            class="popup-btn"
            href="#"
            target="_blank"
            rel="noopener">
            OPEN CHANNEL
        </a>

        <button
            class="popup-btn"
            onclick="closePopup(); showPlayer();">
            WATCH LIVE
        </button>

    </div>

</div>


<script>

/* ==================================================
   YAHAN SIRF 4 CHEEZE CHANGE KARNI HAIN
   ================================================== */

const CHANNEL_NAME = "CRICKET RASH";

const LOGO_URL = "<a href="https://i.ibb.co/TD2HrLv5/IMG-20261026-200738-475.jpg";

const CHANNEL_URL = "https://t.me/cricket_raash";

const PLAYER_URL = "https://crickcast-cricbuzz.pages.dev/?id=B0HMG5YWFC";


/* ==================================================
   DON'T CHANGE BELOW
   ================================================== */


/* Page title */

document.getElementById("pageTitle").textContent = CHANNEL_NAME;


/* Channel */

document.getElementById("channelName").textContent = CHANNEL_NAME;

document.getElementById("channelLogo").src = LOGO_URL;


/* Popup */

document.getElementById("popupName").textContent = CHANNEL_NAME;

document.getElementById("popupLogo").src = LOGO_URL;

document.getElementById("channelLink").href = CHANNEL_URL;


/* Player */

document.getElementById("playerFrame").src = PLAYER_URL;


/* Popup open */

function showPopup() {
    document.getElementById("popupBg").style.display = "flex";
}


/* Popup close */

function closePopup() {
    document.getElementById("popupBg").style.display = "none";
}


/* Player open */

function showPlayer() {

    const player = document.getElementById("playerContainer");

    player.style.display = "block";

    setTimeout(function() {
        player.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }, 100);
}


/* Close popup by clicking outside */

document.getElementById("popupBg").addEventListener("click", function(e) {

    if (e.target === this) {
        closePopup();
    }

});

</script>

</body>
</html>
