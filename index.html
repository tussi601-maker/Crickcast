<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRICKET RASH</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
background:#090d12;
color:#fff;
font-family:Arial,sans-serif;
}

.topbar{
height:55px;
display:flex;
align-items:center;
padding:0 15px;
background:#10161d;
border-bottom:1px solid #202a34;
}

.topbar-title{
font-size:16px;
font-weight:bold;
}

.page{
width:100%;
max-width:900px;
margin:auto;
padding:28px 18px;
}

.channel{
width:100%;
min-height:140px;
background:#111820;
border:1px solid #202b35;
border-radius:10px;
display:flex;
align-items:center;
padding:18px;
gap:16px;
}

.logo-box{
width:120px;
height:110px;
flex-shrink:0;
background:#fff;
border-radius:9px;
overflow:hidden;
}

.logo-box img{
width:100%;
height:100%;
object-fit:contain;
}

.channel-info{
flex:1;
min-width:0;
}

.channel-name{
font-size:19px;
font-weight:bold;
margin-bottom:10px;
}

.live{
display:inline-block;
background:#e53935;
padding:5px 9px;
border-radius:4px;
font-size:11px;
font-weight:bold;
}

.watch-btn{
border:0;
background:#1688d8;
color:#fff;
padding:13px 19px;
border-radius:6px;
font-size:13px;
font-weight:bold;
cursor:pointer;
}

.player-container{
display:none;
width:100%;
margin-top:20px;
background:#000;
border-radius:10px;
overflow:hidden;
border:1px solid #202b35;
}

.player{
width:100%;
aspect-ratio:16/9;
background:#000;
}

.player video{
width:100%;
height:100%;
display:block;
background:#000;
}

.footer{
text-align:center;
color:#59636d;
font-size:11px;
margin-top:30px;
}

@media(max-width:500px){

.channel{
min-height:140px;
padding:16px;
gap:12px;
}

.logo-box{
width:105px;
height:100px;
}

.channel-name{
font-size:16px;
}

.watch-btn{
padding:11px 13px;
font-size:11px;
}

}
</style>
</head>

<body>

<div class="topbar">
<div class="topbar-title">CRICKET RASH</div>
</div>

<div class="page">

<div class="channel">

<div class="logo-box">
<img
src="https://i.ibb.co/TD2HrLv5/IMG-20261026-200738-475.jpg"
alt="CRICKET RASH">
</div>

<div class="channel-info">
<div class="channel-name">CRICKET RASH</div>
<span class="live">LIVE</span>
</div>

<button class="watch-btn" id="watchButton">
WATCH
</button>

</div>


<!-- HLS PLAYER -->

<div class="player-container" id="playerContainer">

<div class="player">

<video
id="videoPlayer"
controls
playsinline
webkit-playsinline>
</video>

</div>

</div>


<div class="footer">
Live Cricket
</div>

</div>


<!-- HLS.JS -->

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

const STREAM_URL =
"https://dai.google.com/ssai/event/_wNibTTjRKGbTJkQbT7_mQ/master.m3u8";

const watchButton =
document.getElementById("watchButton");

const playerContainer =
document.getElementById("playerContainer");

const video =
document.getElementById("videoPlayer");

let hls;


/* WATCH BUTTON */

watchButton.addEventListener("click", function(){

playerContainer.style.display = "block";

loadStream();

setTimeout(function(){

playerContainer.scrollIntoView({
behavior:"smooth",
block:"start"
});

},100);

});


/* LOAD STREAM */

function loadStream(){

if(Hls.isSupported()){

if(hls){
hls.destroy();
}

hls = new Hls();

hls.loadSource(STREAM_URL);

hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,function(){

video.play().catch(function(){

});

});

}else if(
video.canPlayType("application/vnd.apple.mpegurl")
){

video.src = STREAM_URL;

video.addEventListener(
"loadedmetadata",
function(){

video.play().catch(function(){

});

},
{once:true}
);

}

}

</script>

</body>
</html>
